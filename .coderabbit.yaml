language: "ko-KR"

early_access: true
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  commit_status: true
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  labeling_instructions: []

  path_instructions:
    - path: "src/pages/**/*.tsx"
      instructions: >
        ### 화면(page) 컴포넌트
        - 파일명은 PascalCase를 사용해야 합니다.
        - export default 되는 컴포넌트 이름과 파일명이 일치해야 합니다. (예: StyleGuide.tsx → StyleGuide)
        - 여러 화면에서 재사용될 수 있는 UI 조각은 src/components로 분리하도록 제안해주세요.
        - API 요청(fetch, axios 등)이 이 파일에 직접 작성되어 있다면 src/api로 옮기도록 제안해주세요.

    - path: "src/components/**/*.tsx"
      instructions: >
        ### 재사용 컴포넌트
        - 파일명은 PascalCase를 사용해야 하고, 파일명과 컴포넌트 이름이 일치해야 합니다.
        - props는 별도 타입/인터페이스로 선언해야 합니다. (예: XxxProps)
        - any 타입 사용을 피하고 필요한 타입을 명시하도록 제안해주세요.

    - path: "src/api/**/*.ts"
      instructions: >
        ### API 요청
        - API 요청 코드는 이 폴더에서만 관리해야 합니다. 화면·컴포넌트 안에 fetch/axios 호출이
          직접 작성되어 있다면 이 폴더로 옮기도록 제안해주세요.
        - 파일명, 함수명, 변수명은 소문자로 시작하는 camelCase를 사용해야 합니다.

    - path: "**/*.tsx"
      instructions: >
        ### 공통 (TSX)
        - 컴포넌트·파일명은 PascalCase, 함수·변수명은 camelCase를 사용해야 합니다.
        - any 타입 사용을 피하고 필요한 타입을 명시하도록 제안해주세요.
        - 인라인 style 속성보다 Tailwind 클래스 사용을 권장해주세요.
        - 커스텀 CSS 클래스명(Tailwind 유틸리티가 아닌 것)은 kebab-case를 사용해야 합니다.

    - path: "**/*.ts"
      instructions: >
        - 파일명은 소문자로 시작하는 camelCase를 사용해야 합니다.
        - 함수, 변수명은 소문자로 시작하는 camelCase를 사용해야 합니다.
        - 타입 이름은 PascalCase를 사용해야 합니다.
        - any 타입 사용을 피하고 필요한 타입을 명시하도록 제안해주세요.

  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false

  tools:
    eslint:
      enabled: true
    github-checks:
      enabled: true
    gitleaks:
      enabled: true
    biome:
      enabled: false
    shellcheck:
      enabled: false
